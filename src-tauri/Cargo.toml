[package]
name = "crunchyfx"
version = "1.0.0"
description = "crunchyfx — a from-scratch sound effect generator"
authors = ["Alex Cassells"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
