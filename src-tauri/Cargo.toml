[package]
name = "crunchyfx"
version = "1.0.0"
description = "CrunchySFX — a from-scratch sound effect generator"
authors = ["Alex Cassells"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-drag = "2"   # native drag-OUT of a WAV into the OS / a game engine

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
