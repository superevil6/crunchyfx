[package]
name = "crunchyfx"
version = "1.1.0"
description = "CrunchySFX — a from-scratch sound effect generator"
authors = ["Alex Cassells"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-drag = "2"   # native drag-OUT of a WAV into the OS / a game engine

# Linux only: enable WebKitGTK media-stream + grant the mic permission for the Record button
# (main.rs setup hook). Pinned to the version wry already pulls in so it's the same instance.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_40"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
