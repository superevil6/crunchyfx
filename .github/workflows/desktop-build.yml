name: Desktop build (Windows + Linux)

# Builds native installers when you push a version tag (e.g. v1.0.0), and can be
# run on demand from the Actions tab. Produces a DRAFT GitHub Release with the
# installers attached: Windows .exe (NSIS), Linux .deb and .AppImage.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write # needed to create the release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04 # Linux: .deb + .AppImage
          - platform: windows-latest # Windows: .exe (NSIS)
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # crunchyfx is one index.html at the repo root; copy it into ../dist for Tauri.
      # (build.rs also does this, but doing it here first is belt-and-suspenders.)
      - name: Prepare frontend
        shell: bash
        run: mkdir -p dist && cp index.html dist/index.html

      - name: Install Linux webview deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf

      - name: Set up Rust (official stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Build the app + create draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "crunchyfx ${{ github.ref_name }}"
          releaseBody: "Desktop builds of crunchyfx. Windows installer + Linux .deb/.AppImage attached below."
          releaseDraft: true
          prerelease: false
