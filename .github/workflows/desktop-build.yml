name: Desktop build (Windows + Linux)

# Builds native installers when you push a version tag (e.g. v1.0.0), and can be
# run on demand from the Actions tab. Produces a DRAFT GitHub Release with the
# installers attached: Windows .exe (NSIS), Linux .deb and .AppImage.
#
# On a TAG push it ALSO uploads the Windows build straight to itch.io via butler, so the paid
# binaries never sit on a public surface. The GitHub release stays a DRAFT on purpose —
# NEVER click "Publish release", or the paid installers become free public downloads.
#
# LINUX IS PUSHED BY HAND (see ITCH-RELEASE.md §5): the Flatpak is built locally, and the
# AppImage must be verified on non-bleeding-edge hardware before it's safe to sell.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  ITCH_TARGET: sevi66/crunchysfx # <itch-user>/<project-slug> — must match your itch page URL

jobs:
  build:
    permissions:
      contents: write # needed to create the release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04 # Linux: .deb + .AppImage
          - platform: windows-latest # Windows: .exe (NSIS)
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # The frontend is FOUR sibling files at the repo root — they must all land in ../dist
      # side by side or the app throws at startup (dsp.js defines the engines, presets.js the
      # library, styles.css the UI). build.rs copies them too; this is belt-and-suspenders.
      - name: Prepare frontend
        shell: bash
        run: mkdir -p dist && cp index.html dsp.js presets.js styles.css dist/

      - name: Install Linux webview deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf

      - name: Set up Rust (official stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Build the app + create draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "CrunchySFX ${{ github.ref_name }}"
          releaseBody: "Desktop builds of CrunchySFX. Windows installer + Linux .deb/.AppImage attached below."
          releaseDraft: true
          prerelease: false

      # ---- Publish the Windows build straight to itch.io (purchase-gated, never public) ----
      # Tag pushes only, so a manual "Run workflow" can't accidentally ship to the store.
      - name: Install butler (itch.io CLI)
        if: matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          # butler moved hosts: broth.itch.ovh was RETIRED (now NXDOMAIN) → use broth.itch.zone.
          # curl.exe (bundled on the runner) retries transient CDN hiccups; Invoke-WebRequest does not.
          curl.exe -sL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30 -o butler.zip https://broth.itch.zone/butler/windows-amd64/LATEST/archive/default
          Expand-Archive -Force butler.zip -DestinationPath butler-bin
          "$PWD\butler-bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Push Windows build to itch.io
        if: matrix.platform == 'windows-latest' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "::warning::BUTLER_API_KEY secret is not set — skipping the itch.io upload."
            exit 0
          fi
          butler -V
          # NOTE: glob is UNQUOTED so the shell expands it; quoting would pass a literal '*' to butler.
          butler push src-tauri/target/release/bundle/nsis/CrunchySFX_*_x64-setup.exe \
            "$ITCH_TARGET:windows" --userversion "${GITHUB_REF_NAME#v}"
          butler status "$ITCH_TARGET"

      # ---- Linux: wrap the .deb into a Flatpak, then ship THAT to itch ----
      # Flatpak (not the AppImage) is the Linux product: its runtime brokers the host GPU drivers,
      # so it works on bleeding-edge distros (Arch/CachyOS/Steam Deck, RDNA-4-era GPUs) where the
      # AppImage's bundled GL libs blank-screen. Building here on ubuntu-22.04 (glibc 2.35) is also
      # REQUIRED — a .deb built on a newer host needs a glibc the GNOME 46 runtime doesn't have.
      # The .AppImage is still attached to the draft release, but is NOT pushed to itch until it's
      # been verified on a non-bleeding-edge machine.
      - name: Install flatpak tooling + runtime
        if: matrix.platform == 'ubuntu-22.04' && startsWith(github.ref, 'refs/tags/v')
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          # ~1.5 GB download; the slowest step in this job.
          flatpak install -y --user flathub org.gnome.Platform//46 org.gnome.Sdk//46

      - name: Build the Flatpak bundle
        if: matrix.platform == 'ubuntu-22.04' && startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # The manifest takes the .deb as its source — see flatpak/com.crunchysfx.app.yml
          cp src-tauri/target/release/bundle/deb/*.deb flatpak/crunchysfx.deb
          cd flatpak
          # --disable-rofiles-fuse: CI runners can't always use FUSE for the build overlay.
          flatpak-builder --force-clean --user --disable-rofiles-fuse \
            --repo=repo build-dir com.crunchysfx.app.yml
          flatpak build-bundle repo "CrunchySFX-${VERSION}.flatpak" com.crunchysfx.app
          ls -la ./*.flatpak

      - name: Install butler (itch.io CLI)
        if: matrix.platform == 'ubuntu-22.04' && startsWith(github.ref, 'refs/tags/v')
        run: |
          # butler moved hosts: broth.itch.ovh was RETIRED (now NXDOMAIN) → use broth.itch.zone.
          # --retry-all-errors covers transient CDN hiccups on the new host (Cloudflare R2 mirror).
          curl -sL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30 \
            -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -o butler.zip -d "$HOME/butler-bin"
          chmod +x "$HOME/butler-bin/butler"
          echo "$HOME/butler-bin" >> "$GITHUB_PATH"

      - name: Push Linux (Flatpak) to itch.io
        if: matrix.platform == 'ubuntu-22.04' && startsWith(github.ref, 'refs/tags/v')
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then
            echo "::warning::BUTLER_API_KEY secret is not set — skipping the itch.io upload."
            exit 0
          fi
          butler -V
          butler push flatpak/CrunchySFX-*.flatpak \
            "$ITCH_TARGET:linux-flatpak" --userversion "${GITHUB_REF_NAME#v}"
          butler status "$ITCH_TARGET"
