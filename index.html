<title>crunchyfx — sound effect generator</title>
<style>
  :root {
    --bg: #14121a;
    --panel: #1e1b28;
    --panel2: #262231;
    --ink: #e8e4f0;
    --muted: #9a92ad;
    --accent: #ff7a45;
    --accent2: #45d0ff;
    --line: #322c40;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(1200px 600px at 70% -10%, #241f30, var(--bg));
    color: var(--ink);
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 20px 24px 8px;
    flex-wrap: wrap;
  }
  h1 {
    font-size: 22px;
    margin: 0;
    letter-spacing: -0.5px;
  }
  h1 b { color: var(--accent); }
  .tag { color: var(--muted); font-size: 13px; }
  main {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
    padding: 14px 24px 32px;
    max-width: 1200px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px 16px;
  }
  .panel h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent2);
    margin: 0 0 12px;
  }
  .row {
    display: grid;
    grid-template-columns: 88px 1fr 52px;
    align-items: center;
    gap: 8px;
    margin: 8px 0;
  }
  .row label { color: var(--muted); font-size: 12px; }
  .row output {
    font-variant-numeric: tabular-nums;
    text-align: right;
    color: var(--ink);
    font-size: 12px;
  }
  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 3px;
    background: var(--panel2);
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: 2px solid #1a1622;
  }
  input[type=range]::-moz-range-thumb {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: 2px solid #1a1622;
  }
  select {
    width: 100%;
    background: var(--panel2);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 6px 8px;
    font: inherit;
  }
  .waverow {
    display: grid;
    grid-template-columns: 88px 1fr auto;
    align-items: center;
    gap: 8px;
    margin: 8px 0;
  }
  .wavelock {
    display: flex; align-items: center; gap: 4px;
    font-size: 12px; color: var(--muted); cursor: pointer;
    user-select: none;
  }
  .wavelock input { accent-color: var(--accent); cursor: pointer; margin: 0; }
  .controls {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    padding: 10px 24px;
    background: rgba(20,18,26,0.85);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  button {
    background: var(--panel2);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 14px;
    font: inherit;
    cursor: pointer;
    transition: background .12s, transform .05s;
  }
  button:hover { background: #302a3d; }
  button:active { transform: translateY(1px); }
  button.primary {
    background: var(--accent);
    color: #201005;
    border-color: transparent;
    font-weight: 600;
  }
  button.primary:hover { background: #ff8a5c; }
  button.accent2 { border-color: var(--accent2); color: var(--accent2); }
  .spacer { flex: 1; }
  canvas {
    width: 100%;
    height: 90px;
    background: var(--panel2);
    border-radius: 8px;
    display: block;
  }
  .hint { color: var(--muted); font-size: 12px; }
  kbd {
    background: var(--panel2);
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 1px 6px;
    font: 11px ui-monospace, monospace;
  }
  .presetbar { display: flex; flex-direction: column; gap: 8px; }
  .preset-section { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); overflow: hidden; }
  .preset-section > summary {
    list-style: none; cursor: pointer; user-select: none;
    padding: 9px 12px; font-size: 12px; font-weight: 600; letter-spacing: 0.4px;
    color: var(--ink); display: flex; align-items: center; gap: 8px;
  }
  .preset-section > summary::-webkit-details-marker { display: none; }
  .preset-section > summary::before {
    content: "▶"; font-size: 9px; color: var(--muted); transition: transform 0.12s ease;
  }
  .preset-section[open] > summary::before { transform: rotate(90deg); }
  .preset-section > summary:hover { color: var(--accent); }
  .preset-section .sec-count { color: var(--muted); font-weight: 400; font-size: 11px; }
  .sec-buttons { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 12px 12px; }
  .presetbar button { padding: 6px 10px; font-size: 12px; }
  .presetsearch { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  #presetSearch {
    width: 280px; max-width: 100%;
    background: var(--panel2); color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 10px; font: inherit;
  }
  #presetSearch::placeholder { color: var(--muted); }
  #presetSearch:focus { outline: none; border-color: var(--accent2); }

  /* Crunchiness macro slider */
  .macro {
    max-width: 1200px;
    margin: 16px 24px 0;
    background: linear-gradient(90deg, #221d2b, #2c2233);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 16px 14px;
  }
  .macro-title {
    font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--accent); font-weight: 600; margin-bottom: 10px;
  }
  .macro-row { display: flex; align-items: center; gap: 14px; }
  .macro-row + .macro-row { margin-top: 10px; }
  .macro-name { min-width: 104px; font-size: 13px; font-weight: 600; color: var(--ink); }
  .macro-end { font-size: 12px; color: var(--muted); min-width: 56px; }
  .macro-end-r { text-align: right; }
  #crunch { flex: 1; height: 6px; }
  #crunch::-webkit-slider-thumb { width: 20px; height: 20px; }
  #crunch::-moz-range-thumb { width: 20px; height: 20px; }

  /* History rail (right side) */
  body { padding-right: 300px; }
  #history {
    position: fixed; top: 0; right: 0;
    width: 284px; height: 100vh;
    background: var(--panel);
    border-left: 1px solid var(--line);
    display: flex; flex-direction: column;
    z-index: 6;
  }
  .hist-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 16px 10px;
    border-bottom: 1px solid var(--line);
  }
  .hist-head h2 {
    margin: 0; font-size: 12px; letter-spacing: 1px;
    text-transform: uppercase; color: var(--accent2);
  }
  .hist-head button { padding: 4px 9px; font-size: 11px; }
  #histlist { flex: 1; overflow-y: auto; padding: 10px; }
  .hist-empty { color: var(--muted); font-size: 12px; padding: 14px 6px; line-height: 1.6; }
  .hist-item {
    display: grid;
    grid-template-columns: 74px 1fr;
    gap: 8px; align-items: center;
    background: var(--panel2);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 8px; margin-bottom: 8px;
  }
  .hist-thumb { width: 74px; height: 34px; background: #14121a; border-radius: 5px; display: block; }
  .hist-meta { min-width: 0; }
  .hist-label { display: block; font-size: 12px; font-weight: 600; color: var(--ink); }
  .hist-sub { display: block; font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .hist-actions { grid-column: 1 / -1; display: flex; gap: 6px; }
  .hist-actions button { flex: 1; padding: 5px 0; font-size: 12px; }
  .hist-item.silent { opacity: 0.6; border-color: #7a3b3b; }
  .hist-item.silent .hist-label { color: #ff8a8a; }
  #normbtn.off { opacity: 0.55; }

  /* Sequence tray */
  .seqbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin: 12px 24px 0; padding: 10px 12px; max-width: 1200px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  .seq-label { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--accent2); font-weight: 600; }
  .seq-list { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: 1; min-width: 160px; }
  .seq-empty { font-size: 12px; color: var(--muted); }
  .seq-chip { display: flex; align-items: center; gap: 6px; padding: 4px 6px 4px 8px;
    background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; font-size: 12px; cursor: grab; }
  .seq-chip.drag { opacity: 0.4; }
  .seq-chip-name { color: var(--ink); }
  .seq-chip button { background: none; border: none; color: var(--muted); cursor: pointer; padding: 0 3px; font-size: 12px; }
  .seq-chip button:hover { color: var(--accent); }
  .seqbar button[disabled] { opacity: 0.4; cursor: default; }

  /* Breeding modal */
  .modal { position: fixed; inset: 0; z-index: 200; background: rgba(10, 8, 14, 0.82);
    display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal[hidden] { display: none; }
  .modal-box { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    width: min(940px, 100%); max-height: 92vh; display: flex; flex-direction: column; overflow: hidden; }
  .modal-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .modal-head h2 { margin: 0; font-size: 16px; color: var(--accent); white-space: nowrap; }
  .modal-head .hint { flex: 1; }
  .breed-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 16px; overflow-y: auto; }
  .breed-cell { border: 2px solid var(--line); border-radius: 10px; background: var(--panel2);
    padding: 8px; cursor: pointer; transition: border-color 0.1s, box-shadow 0.1s; }
  .breed-cell:hover { border-color: var(--accent2); }
  .breed-cell.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .breed-cell canvas { width: 100%; height: 62px; display: block; background: #17131f; border-radius: 6px; }
  .breed-cell-bar { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .breed-cell-bar .breed-play { padding: 2px 9px; font-size: 12px; }
  .breed-tag { font-size: 11px; color: var(--muted); }
  .breed-cell.sel .breed-tag { color: var(--accent); font-weight: 600; }
  .modal-foot { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-top: 1px solid var(--line); }
  @media (max-width: 920px) {
    body { padding-right: 0; }
    #history {
      position: static; width: auto; height: auto;
      border-left: none; border-top: 1px solid var(--line);
    }
    #histlist { max-height: 320px; }
  }
</style>

<header>
  <h1>crunchy<b>fx</b></h1>
  <span class="tag">a from-scratch sound effect generator</span>
</header>

<div class="controls">
  <button class="primary" id="play">▶ Play <kbd>space</kbd></button>
  <button id="rand" class="accent2">🎲 Randomize</button>
  <button id="breed" class="accent2">🧬 Breed</button>
  <button id="export">⬇ Export WAV</button>
  <span class="spacer"></span>
  <button id="save">Save preset</button>
  <button id="load">Load preset</button>
  <button id="share" title="Copy a link that recreates this exact sound">🔗 Share link</button>
  <input type="file" id="loadfile" accept="application/json" hidden>
</div>

<div class="seqbar" id="seqbar">
  <span class="seq-label">Sequence</span>
  <div class="seq-list" id="seqlist"></div>
  <button id="seqAdd" title="Append the current editor sound to the sequence">＋ Add current sound</button>
  <span class="spacer"></span>
  <button id="seqPlay" class="primary">▶ Play sequence</button>
  <button id="seqExport">⬇ Export</button>
  <button id="seqClear">Clear</button>
</div>

<div style="padding: 14px 24px 0; max-width: 1200px;">
  <canvas id="scope" width="1160" height="90"></canvas>
  <div class="presetsearch">
    <input type="text" id="presetSearch" placeholder="Search presets… (e.g. fire)" autocomplete="off" spellcheck="false">
    <span id="presetCount" class="hint"></span>
  </div>
  <div class="presetbar" id="presets" style="margin-top:10px"></div>
</div>

<div class="macro" id="macros">
  <div class="macro-title">Quick shape — one slider each moves several controls at once</div>
</div>

<main id="panels"></main>

<aside id="history">
  <div class="hist-head">
    <h2>History</h2>
    <button id="clearhist">Clear</button>
  </div>
  <div id="histlist"></div>
</aside>

<script>
"use strict";

// ---------- Parameter model ----------
// Each param: key, label, min, max, step, default, unit, group.
const WAVES = ["sine", "square", "saw", "triangle", "pulse", "FM", "organ", "half-sine", "pluck"];
const FILTER_MODES = ["lowpass", "highpass", "bandpass", "notch", "peak"];

const PARAMS = [
  // Oscillator
  ["wave",       "Waveform",   0, WAVES.length - 1, 1, 2, "",   "Oscillator", "wave"],
  ["freq",       "Frequency",  20, 4000, 1, 440, "Hz", "Oscillator"],
  ["sweep",      "Pitch sweep",-1, 1, 0.01, 0, "",  "Oscillator"],
  ["vibDepth",   "Vibrato",    0, 1, 0.01, 0, "",   "Oscillator"],
  ["vibRate",    "Vib rate",   0, 40, 0.1, 6, "Hz", "Oscillator"],
  ["unison",     "Unison",     1, 7, 1, 1, "v",     "Oscillator"],
  ["detune",     "Detune",     0, 50, 0.5, 12, "ct","Oscillator"],
  // Pulse width + PWM (applies to the pulse wave); pluck damping (Karplus-Strong)
  ["pulseWidth", "Pulse width",0.05, 0.95, 0.01, 0.25, "", "Oscillator"],
  ["pwmDepth",   "PWM depth",  0, 0.45, 0.01, 0, "",  "Oscillator"],
  ["pwmRate",    "PWM rate",   0, 20, 0.1, 2, "Hz",   "Oscillator"],
  ["pluckDamp",  "Pluck damp", 0, 1, 0.01, 0.5, "",   "Oscillator"],
  // Mix
  ["noise",      "Noise mix",  0, 1, 0.01, 0, "",   "Mix"],
  ["subOsc",     "Sub osc",    0, 1, 0.01, 0, "",   "Mix"],
  ["ringMod",    "Ring mod",   0, 1, 0.01, 0, "",   "Mix"],
  ["ringFreq",   "Ring freq",  0, 2000, 1, 200, "Hz","Mix"],
  // Body: a deep sine layer with its own long decay + pitch drop, for weight/depth
  ["boom",       "Boom level", 0, 1, 0.01, 0, "",    "Body"],
  ["boomFreq",   "Boom freq",  25, 200, 1, 80, "Hz", "Body"],
  ["boomDrop",   "Boom drop",  0, 3, 0.01, 0.6, "oct","Body"],
  ["boomDecay",  "Boom decay", 0.02, 1.2, 0.01, 0.25, "s", "Body"],
  // Amp envelope
  ["attack",     "Attack",     0, 0.5, 0.001, 0.005, "s", "Amp Envelope"],
  ["decay",      "Decay",      0, 1, 0.001, 0.12, "s",  "Amp Envelope"],
  ["sustain",    "Sustain",    0, 1, 0.01, 0.0, "",     "Amp Envelope"],
  ["release",    "Release",    0, 1.5, 0.001, 0.1, "s", "Amp Envelope"],
  ["hold",       "Hold",       0, 1, 0.001, 0.02, "s",  "Amp Envelope"],
  // Filter
  ["filterMode", "Filter type",0, FILTER_MODES.length - 1, 1, 0, "", "Filter", "enum", FILTER_MODES],
  ["cutoff",     "Cutoff",     40, 12000, 1, 8000, "Hz", "Filter"],
  ["reso",       "Resonance",  0, 0.95, 0.01, 0.1, "",   "Filter"],
  ["filtEnv",    "Filter env", -1, 1, 0.01, 0, "",       "Filter"],
  // Crunch
  ["drive",      "Drive",      0, 1, 0.01, 0.1, "",  "Crunch"],
  ["driveOS",    "Drive OS",   1, 8, 1, 1, "x",     "Crunch"],
  ["bitcrush",   "Bit depth",  1, 16, 1, 16, "bit", "Crunch"],
  ["downsample", "Downsample", 1, 32, 1, 1, "x",    "Crunch"],
  // Space
  ["width",      "Stereo width",0, 1, 0.01, 0.4, "", "Space"],
  ["reverb",     "Reverb mix", 0, 1, 0.01, 0, "",    "Space"],
  ["reverbSize", "Reverb size",0, 1, 0.01, 0.6, "",  "Space"],
  ["reverbTone", "Reverb tone",0, 1, 0.01, 0.5, "",  "Space"],
  ["delay",      "Delay mix",  0, 1, 0.01, 0, "",     "Space"],
  ["delayTime",  "Delay time", 0.01, 0.5, 0.005, 0.15, "s", "Space"],
  ["delayFb",    "Delay fbk",  0, 0.9, 0.01, 0.35, "", "Space"],
  // Burst / full-auto: retrigger the whole shot N times at a fixed rate
  ["repeat",     "Shots",      1, 12, 1, 1, "x",    "Burst"],
  ["rate",       "Fire rate",  1, 30, 0.5, 10, "Hz","Burst"],
  // Output
  ["gain",       "Gain",       0, 1, 0.01, 0.7, "",     "Output"],
  ["duration",   "Duration",   0.05, 2, 0.01, 0.4, "s", "Output"],
];

const state = {};
for (const p of PARAMS) state[p[0]] = p[5];

let waveLocked = false;   // when true, presets/randomize/load keep the current waveform
let seqLabel = "Sound";   // label of the sound currently in the editor (for Sequence chips)

const SR = 44100;

// ---------- DSP helpers ----------
// PolyBLEP: a small correction added at each discontinuity to band-limit the
// waveform, removing the harsh aliasing that makes naive saw/square sound "8-bit".
function polyBlep(t, dt) {
  if (t < dt) { t /= dt; return t + t - t * t - 1; }
  if (t > 1 - dt) { t = (t - 1) / dt; return t * t + t + t + 1; }
  return 0;
}

// waveform: phase in [0,1), dt = freq/SR (needed for band-limiting).
// duty is the pulse-wave width (0.05..0.95); ignored by the other shapes.
function waveform(type, phase, dt, duty) {
  switch (type) {
    case 0: return Math.sin(2 * Math.PI * phase);            // sine (inherently band-limited)
    case 1: {                                                // square (band-limited)
      let v = phase < 0.5 ? 1 : -1;
      v += polyBlep(phase, dt);
      v -= polyBlep((phase + 0.5) % 1, dt);
      return v;
    }
    case 2: {                                                // saw (band-limited)
      return (2 * phase - 1) - polyBlep(phase, dt);
    }
    case 3: return 4 * Math.abs(phase - 0.5) - 1;            // triangle (negligible aliasing)
    case 4: {                                                // pulse — variable duty (PWM), band-limited, DC-centered
      const D = duty;
      let v = phase < D ? 1 : -1;
      v += polyBlep(phase, dt);
      v -= polyBlep((phase + (1 - D)) % 1, dt);
      return v - (2 * D - 1);                                // remove the pulse's DC offset
    }
    case 5: {                                                // FM — metallic / electric-piano character
      const ratio = 2;                                       // integer keeps it periodic (no wrap click)
      const index = 2.2 * Math.max(0.15, 1 - dt * 1.8);      // taper modulation up high to limit aliasing
      return Math.sin(2 * Math.PI * phase + index * Math.sin(2 * Math.PI * ratio * phase));
    }
    case 6: {                                                // organ — additive harmonics, truly band-limited
      const amps = [1, 0.6, 0.35, 0.5, 0.12, 0.3, 0.1, 0.22];
      let v = 0, norm = 0;
      for (let k = 0; k < amps.length; k++) {
        const h = k + 1;
        if (h * dt >= 0.5) break;                            // stop before Nyquist -> no aliasing
        v += amps[k] * Math.sin(2 * Math.PI * h * phase);
        norm += amps[k];
      }
      return norm > 0 ? v / norm : 0;
    }
    case 7: {                                                // half-sine — rectified, hollow/reedy
      const s = Math.max(0, Math.sin(2 * Math.PI * phase));
      return (s - 0.3183) * 1.4;                             // subtract mean (1/pi) to remove DC
    }
    default: return 0;
  }
}

// Freeverb-style reverb applied in place to stereo buffers. 8 parallel damped
// combs + 4 series allpass per channel; the right channel's delays are stretched
// (stereospread) to decorrelate the two channels -> a wide, deep tail.
function reverbProcess(L, R, size, tone, wet) {
  const n = L.length;
  const fb = 0.7 + size * 0.28;         // room size -> comb feedback (0.7..0.98)
  const damp = (1 - tone) * 0.4;        // tone -> high-freq damping in the tail
  const combT = [1116, 1188, 1277, 1356, 1422, 1491, 1557, 1617];
  const apT = [556, 441, 341, 225];
  const spread = 23;
  const fixedGain = 0.015;
  const src = [Float32Array.from(L), Float32Array.from(R)];
  const dst = [L, R];
  for (let c = 0; c < 2; c++) {
    const off = c === 1 ? spread : 0;
    const combBuf = combT.map(len => new Float32Array(len + off));
    const combIdx = combT.map(() => 0);
    const combLP = combT.map(() => 0);
    const apBuf = apT.map(len => new Float32Array(len + off));
    const apIdx = apT.map(() => 0);
    const dry = src[c], out = dst[c];
    for (let i = 0; i < n; i++) {
      const input = dry[i] * fixedGain;
      let mono = 0;
      for (let k = 0; k < combBuf.length; k++) {
        const buf = combBuf[k], idx = combIdx[k];
        const y = buf[idx];
        combLP[k] = y * (1 - damp) + combLP[k] * damp;   // lowpass in feedback path
        buf[idx] = input + combLP[k] * fb;
        combIdx[k] = idx + 1 === buf.length ? 0 : idx + 1;
        mono += y;
      }
      for (let k = 0; k < apBuf.length; k++) {
        const buf = apBuf[k], idx = apIdx[k];
        const bufout = buf[idx];
        const y = bufout - mono;
        buf[idx] = mono + bufout * 0.5;
        apIdx[k] = idx + 1 === buf.length ? 0 : idx + 1;
        mono = y;
      }
      out[i] = dry[i] + wet * mono;
    }
  }
}

// ---------- Audibility ----------
// A sound whose intrinsic peak is below this floor (~ -66 dB) is treated as
// inaudible: normalization can't rescue it, so we re-roll or flag it instead.
const AUDIBLE_FLOOR = 1e-3;  // below this (~ -60 dB) a sound counts as inaudible
const NORM_TARGET = 0.9;     // loudness-normalize quiet sounds up to this peak...
const NORM_MAX_BOOST = 300;  // ...capped at ~50 dB makeup so gated silence can't become hiss
let normalizeOut = true;    // toggled by the Normalize button

// ---------- DSP: render state -> stereo {L, R, rawPeak} ----------
function render() {
  const dur = state.duration;
  const n = Math.max(1, Math.floor(dur * SR));
  const L = new Float32Array(n);
  const R = new Float32Array(n);

  const susLevel = state.sustain;
  const atk = state.attack, dec = state.decay, hold = state.hold, rel = state.release;
  // burst: retrigger the shot `repeat` times at `rate` Hz. `slot` is one shot's
  // length; each shot gets its own local time so the envelope, pitch sweep and
  // filter env all re-fire per shot instead of once across the whole buffer.
  const repeat = Math.max(1, Math.round(state.repeat || 1));
  const rate = Math.max(0.5, state.rate || 10);
  const slot = repeat > 1 ? 1 / rate : dur;
  const relStart = Math.max(atk + hold + dec, slot - rel);

  const baseFreq = state.freq;
  const sweep = state.sweep;
  const waveType = Math.round(state.wave);
  const baseCut = state.cutoff;
  const filtEnv = state.filtEnv;
  const fmode = Math.round(state.filterMode);   // 0 LP, 1 HP, 2 BP, 3 notch, 4 peak

  // deterministic LCG so exports are reproducible
  let seed = 22222;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return (seed / 4294967296) * 2 - 1; };

  // unison: V detuned voices, each with its own phase + equal-power stereo pan.
  // Detune (beating) + stereo spread is what turns one thin voice into a thick one.
  const V = Math.max(1, Math.round(state.unison));
  const width = state.width;
  const phases = new Float32Array(V);
  const ratios = new Float32Array(V);
  const panL = new Float32Array(V);
  const panR = new Float32Array(V);
  const voiceGain = 1 / Math.sqrt(V);
  for (let v = 0; v < V; v++) {
    phases[v] = V > 1 ? v / V : 0;                          // spread start phases
    const d = V > 1 ? (v / (V - 1)) * 2 - 1 : 0;            // -1..1 across the voices
    ratios[v] = Math.pow(2, (d * state.detune) / 1200);    // cents -> frequency ratio
    const pan = d * width;                                  // spread across the stereo field
    panL[v] = Math.cos((pan + 1) * Math.PI / 4);
    panR[v] = Math.sin((pan + 1) * Math.PI / 4);
  }

  let subPhase = 0, vibPhase = 0;
  let ic1L = 0, ic2L = 0, ic1R = 0, ic2R = 0;   // per-channel TPT filter state
  let ringPhase = 0, pwmPhase = 0;              // ring-mod carrier + PWM LFO phases
  let xprevL = 0, xprevR = 0;                   // previous pre-drive sample (for oversampling)
  // Karplus-Strong plucked string (wave "pluck"): a noise-filled delay line whose
  // averaging feedback both sets the pitch (length = SR/freq) and damps the tail.
  const isPluck = waveType === 8;
  const ksBuf = isPluck ? new Float32Array(2206) : null;   // max length at 20 Hz
  let ksN = 0, ksIdx = 0, ksPrevShot = -1;
  const ksRho = 0.999 - 0.02 * state.pluckDamp;            // string decay (higher damp -> shorter)

  // Body layer: a clean low sine with its OWN exponential decay and a downward
  // pitch drop, independent of the crack envelope. Because it rings longer than the
  // transient (and is added after the drive stage so it isn't squashed), it's what
  // gives the shot chest-thump depth instead of just a short click.
  const boom = state.boom, boomF0 = state.boomFreq;
  const boomDrop = state.boomDrop, boomDec = Math.max(0.01, state.boomDecay);
  let boomPhase = 0, prevShot = -1;

  for (let i = 0; i < n; i++) {
    const t = i / SR;
    const shotIdx = repeat > 1 ? Math.min(repeat - 1, Math.floor(t / slot)) : 0;
    const lt = t - shotIdx * slot;                 // time since this shot fired
    const prog = slot > 0 ? Math.min(1, lt / slot) : 0;

    const sweepMul = Math.pow(2, sweep * 4 * prog);
    const vib = state.vibDepth * Math.sin(vibPhase);
    const f = baseFreq * sweepMul * Math.pow(2, vib * 0.5);
    // keep the fundamental in the reproducible band so upward sweeps don't push it
    // ultrasonic (which aliases to garbage / near-silence instead of a real tone)
    const fOsc = Math.min(f, 20000);
    vibPhase += 2 * Math.PI * state.vibRate / SR;

    // pulse-width for this sample: base width wobbled by the PWM LFO
    let duty = state.pulseWidth;
    if (state.pwmDepth > 0) {
      pwmPhase += state.pwmRate / SR; if (pwmPhase >= 1) pwmPhase -= 1;
      duty += state.pwmDepth * Math.sin(2 * Math.PI * pwmPhase);
      if (duty < 0.05) duty = 0.05; else if (duty > 0.95) duty = 0.95;
    }

    let oscL = 0, oscR = 0;
    if (isPluck) {
      // (re-)excite the delay line at each shot, then pluck one sample out of it
      if (shotIdx !== ksPrevShot) {
        ksPrevShot = shotIdx;
        ksN = Math.min(2205, Math.max(2, Math.round(SR / Math.max(20, fOsc))));
        ksIdx = 0;
        for (let j = 0; j < ksN; j++) ksBuf[j] = rnd();
      }
      const y = ksBuf[ksIdx];
      const nxt = ksIdx + 1 >= ksN ? 0 : ksIdx + 1;
      ksBuf[ksIdx] = (y + ksBuf[nxt]) * 0.5 * ksRho;   // lowpass-in-the-loop = damping
      ksIdx = nxt;
      oscL = y; oscR = y;                              // mono, centered (ignores unison)
    } else {
      // sum unison voices into L/R
      for (let v = 0; v < V; v++) {
        const dt = (fOsc * ratios[v]) / SR;
        let ph = phases[v] + dt;
        if (ph >= 1) ph -= 1;
        phases[v] = ph;
        const w = waveform(waveType, ph, dt, duty);
        oscL += w * panL[v];
        oscR += w * panR[v];
      }
      oscL *= voiceGain; oscR *= voiceGain;
    }

    // sub oscillator: clean sine an octave down, centered, for weight
    if (state.subOsc > 0) {
      subPhase += (fOsc * 0.5) / SR; if (subPhase >= 1) subPhase -= 1;
      const sub = Math.sin(2 * Math.PI * subPhase) * state.subOsc;
      const k = 1 - state.subOsc * 0.5;
      oscL = oscL * k + sub; oscR = oscR * k + sub;
    }

    // noise (centered)
    let sL = oscL, sR = oscR;
    if (state.noise > 0) {
      const nz = rnd() * state.noise, k = 1 - state.noise;
      sL = oscL * k + nz; sR = oscR * k + nz;
    }

    // ring modulation: multiply the source by a sine carrier -> inharmonic,
    // metallic/clangy partials. Dry/wet blended by the mix amount.
    if (state.ringMod > 0) {
      ringPhase += state.ringFreq / SR; if (ringPhase >= 1) ringPhase -= 1;
      const rm = Math.sin(2 * Math.PI * ringPhase), mix = state.ringMod;
      sL = sL * (1 - mix) + sL * rm * mix;
      sR = sR * (1 - mix) + sR * rm * mix;
    }

    // amp envelope (AHDSR-ish)
    let env;
    if (lt < atk) env = atk > 0 ? lt / atk : 1;
    else if (lt < atk + hold) env = 1;
    else if (lt < atk + hold + dec) { const d = (lt - atk - hold) / (dec || 1e-9); env = 1 - (1 - susLevel) * d; }
    else if (lt < relStart) env = susLevel;
    else { const r = rel > 0 ? (lt - relStart) / rel : 1; env = susLevel * (1 - r); }
    if (env < 0) env = 0;
    sL *= env; sR *= env;

    // resonant low-pass — TPT / zero-delay-feedback state-variable filter
    // (Zavalishin). Unconditionally stable at ALL cutoffs; the old Chamberlin SVF
    // self-oscillated at Nyquist once cutoff neared SR/4, which turned bright sounds
    // into 22 kHz buzz that plays back as clicks/silence.
    let cut = baseCut * Math.pow(2, filtEnv * 3 * prog);
    cut = Math.min(Math.max(cut, 20), 20000);
    const g = Math.tan(Math.PI * cut / SR);
    const k = Math.max(2 - 1.9 * state.reso, 0.1);       // damping = 1/Q
    const a1 = 1 / (1 + g * (g + k)), a2 = g * a1, a3 = g * a2;
    // The SVF yields all responses at once: v2 = LP, v1 = BP, hp = HP.
    // notch = HP + LP, peak = LP - HP. fmode selects which one we keep.
    {
      const x = sL;
      const v3 = x - ic2L;
      const v1 = a1 * ic1L + a2 * v3;
      const v2 = ic2L + a2 * ic1L + a3 * v3;
      ic1L = 2 * v1 - ic1L; ic2L = 2 * v2 - ic2L;
      const hp = x - k * v1 - v2;
      sL = fmode === 0 ? v2 : fmode === 1 ? hp : fmode === 2 ? v1 : fmode === 3 ? hp + v2 : v2 - hp;
    }
    {
      const x = sR;
      const v3 = x - ic2R;
      const v1 = a1 * ic1R + a2 * v3;
      const v2 = ic2R + a2 * ic1R + a3 * v3;
      ic1R = 2 * v1 - ic1R; ic2R = 2 * v2 - ic2R;
      const hp = x - k * v1 - v2;
      sR = fmode === 0 ? v2 : fmode === 1 ? hp : fmode === 2 ? v1 : fmode === 3 ? hp + v2 : v2 - hp;
    }

    // crunch: tanh drive + bitcrush
    if (state.drive > 0) {
      const d = 1 + state.drive * 40, norm = Math.tanh(d), amp = 0.6 + 0.4 * (1 - state.drive);
      const OS = Math.max(1, Math.round(state.driveOS));
      if (OS <= 1) {
        sL = Math.tanh(sL * d) / norm * amp;
        sR = Math.tanh(sR * d) / norm * amp;
      } else {
        // oversample the nonlinearity: interpolate from the previous input toward
        // this one, shape each subsample, then average back down. The drive's new
        // harmonics land above the base rate's Nyquist, so far less aliasing folds
        // back — a cleaner crunch. Free here because rendering is offline.
        const pL = xprevL, pR = xprevR;
        let accL = 0, accR = 0;
        for (let s = 1; s <= OS; s++) {
          const f = s / OS;
          accL += Math.tanh((pL + (sL - pL) * f) * d);
          accR += Math.tanh((pR + (sR - pR) * f) * d);
        }
        xprevL = sL; xprevR = sR;
        sL = accL / OS / norm * amp;
        sR = accR / OS / norm * amp;
      }
    }
    const bits = Math.round(state.bitcrush);
    if (bits < 16) {
      const levels = Math.pow(2, bits);
      sL = Math.round(sL * levels) / levels;
      sR = Math.round(sR * levels) / levels;
    }

    // add the deep body last, using local time so it re-fires per shot in bursts
    if (boom > 0) {
      if (shotIdx !== prevShot) { boomPhase = 0; prevShot = shotIdx; }  // retrigger phase
      const bEnv = Math.exp(-lt / boomDec);                              // own long decay
      const bf = boomF0 * Math.pow(2, -boomDrop * Math.min(1, lt / boomDec)); // pitch drop
      boomPhase += bf / SR; if (boomPhase >= 1) boomPhase -= 1;
      const b = Math.sin(2 * Math.PI * boomPhase) * bEnv * boom;
      sL += b; sR += b;
    }

    L[i] = sL; R[i] = sR;
  }

  // downsample crunch (sample-and-hold)
  const ds = Math.round(state.downsample);
  if (ds > 1) {
    let hL = 0, hR = 0;
    for (let i = 0; i < n; i++) {
      if (i % ds === 0) { hL = L[i]; hR = R[i]; }
      L[i] = hL; R[i] = hR;
    }
  }

  // feedback delay (per channel), then reverb -> space & depth
  if (state.delay > 0) {
    const dt = Math.max(1, Math.round(state.delayTime * SR));
    const fbk = state.delayFb, wet = state.delay;
    for (const buf of [L, R]) {
      const acc = new Float32Array(n);
      for (let i = 0; i < n; i++) acc[i] = buf[i] + (i >= dt ? fbk * acc[i - dt] : 0);
      for (let i = dt; i < n; i++) buf[i] += wet * acc[i - dt];
    }
  }
  if (state.reverb > 0) reverbProcess(L, R, state.reverbSize, state.reverbTone, state.reverb);

  // measure intrinsic peak (before gain) for loudness normalization + audibility
  let rawPeak = 0;
  for (let i = 0; i < n; i++) {
    const a = Math.abs(L[i]); if (a > rawPeak) rawPeak = a;
    const b = Math.abs(R[i]); if (b > rawPeak) rawPeak = b;
  }
  // normalize quiet-but-present sounds up to a consistent level (capped so we never
  // amplify near-silence into hiss); the user gain then trims from there.
  let norm = 1;
  if (normalizeOut && rawPeak > AUDIBLE_FLOOR) norm = Math.min(NORM_TARGET / rawPeak, NORM_MAX_BOOST);

  // gain + short fade-out, then clip
  const g = state.gain * norm;
  const fade = Math.min(256, Math.floor(n * 0.02));
  for (let i = 0; i < n; i++) {
    let l = L[i] * g, r = R[i] * g;
    if (i > n - fade) { const kf = (n - i) / fade; l *= kf; r *= kf; }
    L[i] = Math.max(-1, Math.min(1, l));
    R[i] = Math.max(-1, Math.min(1, r));
  }
  return { L, R, rawPeak };
}

// ---------- Audio playback ----------
let audioCtx = null;
function ensureCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}

function playBuffer(L, R) {
  const ctx = ensureCtx();
  const buf = ctx.createBuffer(2, L.length, SR);
  buf.copyToChannel(L, 0);
  buf.copyToChannel(R, 1);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  src.connect(ctx.destination);
  src.start();
}

// Render the current state, play it, draw it, and log it to history.
function play(label) {
  const { L, R, rawPeak } = render();
  const audible = rawPeak > AUDIBLE_FLOOR;
  drawScope(L, R);
  if (!audible) markScopeSilent();
  playBuffer(L, R);
  addHistory(label || "Edit", L, audible);
}

// Run fn() with the global `state` temporarily replaced by a snapshot, then
// restore it. Lets us render/export any past sound without disturbing the editor.
function withState(snap, fn) {
  const backup = {};
  for (const p of PARAMS) backup[p[0]] = state[p[0]];
  for (const p of PARAMS) state[p[0]] = (p[0] in snap) ? snap[p[0]] : p[5];
  try { return fn(); } finally { for (const p of PARAMS) state[p[0]] = backup[p[0]]; }
}

// ---------- WAV export (16-bit stereo PCM) ----------
function encodeWav(L, R) {
  const frames = L.length;
  const dataBytes = frames * 2 * 2;   // 2 channels * 16-bit
  const buffer = new ArrayBuffer(44 + dataBytes);
  const view = new DataView(buffer);
  const writeStr = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };
  writeStr(0, "RIFF");
  view.setUint32(4, 36 + dataBytes, true);
  writeStr(8, "WAVE");
  writeStr(12, "fmt ");
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);        // PCM
  view.setUint16(22, 2, true);        // stereo
  view.setUint32(24, SR, true);
  view.setUint32(28, SR * 4, true);   // byte rate = SR * blockAlign
  view.setUint16(32, 4, true);        // block align = 2ch * 2 bytes
  view.setUint16(34, 16, true);
  writeStr(36, "data");
  view.setUint32(40, dataBytes, true);
  let off = 44;
  const enc = (s) => { s = Math.max(-1, Math.min(1, s)); return s < 0 ? s * 0x8000 : s * 0x7FFF; };
  for (let i = 0; i < frames; i++) {
    view.setInt16(off, enc(L[i]), true); off += 2;
    view.setInt16(off, enc(R[i]), true); off += 2;
  }
  return new Blob([view], { type: "audio/wav" });
}

function downloadWav(L, R, name) {
  const blob = encodeWav(L, R);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function exportWav() {
  const { L, R } = render();
  downloadWav(L, R, "crunchyfx-" + Date.now() + ".wav");
}

// ---------- History ----------
// Each entry is a snapshot of the parameters (not the audio) plus a tiny waveform
// thumbnail, so it's cheap to keep many and you can re-render / tweak any of them.
const histList = document.getElementById("histlist");
const histItems = [];
let histSeq = 0;
const HIST_MAX = 50;

function snapshotState() {
  const s = {};
  for (const p of PARAMS) s[p[0]] = state[p[0]];
  return s;
}
function sameState(a, b) {
  for (const p of PARAMS) if (a[p[0]] !== b[p[0]]) return false;
  return true;
}
function thumbPeaks(L) {
  const N = 96, out = new Float32Array(N), step = L.length / N;
  for (let i = 0; i < N; i++) out[i] = L[Math.floor(i * step)] || 0;
  return out;
}
function addHistory(label, L, audible = true) {
  const snap = snapshotState();
  if (histItems.length && sameState(histItems[0].state, snap)) return; // skip exact repeats
  histItems.unshift({
    id: ++histSeq, label, state: snap, peaks: thumbPeaks(L), silent: !audible,
    time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
  });
  if (histItems.length > HIST_MAX) histItems.pop();
  renderHistory();
}
function drawThumb(canvas, peaks) {
  const c = canvas.getContext("2d");
  const w = canvas.width, h = canvas.height;
  c.clearRect(0, 0, w, h);
  c.strokeStyle = "#ff7a45";
  c.lineWidth = 1;
  c.beginPath();
  const step = w / peaks.length;
  for (let i = 0; i < peaks.length; i++) {
    const y = h / 2 - peaks[i] * (h / 2 - 2);
    i === 0 ? c.moveTo(i * step, y) : c.lineTo(i * step, y);
  }
  c.stroke();
}
function replaySnapshot(snap) {
  withState(snap, () => { const { L, R } = render(); drawScope(L, R); playBuffer(L, R); });
}
function loadSnapshot(snap) {
  const keepWave = state.wave;
  for (const p of PARAMS) state[p[0]] = (p[0] in snap) ? snap[p[0]] : p[5];
  if (waveLocked) state.wave = keepWave;
  syncUI();
  const { L, R } = render(); drawScope(L, R); playBuffer(L, R);
}
function renderHistory() {
  if (!histItems.length) {
    histList.innerHTML = '<div class="hist-empty">No sounds yet.<br>Click a preset, hit Randomize, or tweak a slider — every sound you generate lands here.</div>';
    return;
  }
  histList.innerHTML = "";
  for (const item of histItems) {
    const el = document.createElement("div");
    el.className = "hist-item" + (item.silent ? " silent" : "");
    el.innerHTML =
      '<canvas class="hist-thumb" width="74" height="34"></canvas>' +
      '<div class="hist-meta"><span class="hist-label"></span><span class="hist-sub"></span></div>' +
      '<div class="hist-actions">' +
        '<button data-a="play" title="Replay">▶</button>' +
        '<button data-a="load" title="Load into editor (tweak from here)">✎</button>' +
        '<button data-a="wav" title="Download WAV">⬇</button>' +
      '</div>';
    el.querySelector(".hist-label").textContent = item.label + (item.silent ? " ⚠" : "");
    el.querySelector(".hist-sub").textContent =
      Math.round(item.state.freq) + " Hz · " + (+item.state.duration).toFixed(2) + "s · " +
      (item.silent ? "silent" : item.time);
    drawThumb(el.querySelector("canvas"), item.peaks);
    el.querySelector('[data-a="play"]').addEventListener("click", () => replaySnapshot(item.state));
    el.querySelector('[data-a="load"]').addEventListener("click", () => loadSnapshot(item.state));
    el.querySelector('[data-a="wav"]').addEventListener("click", () => withState(item.state, () => {
      const { L, R } = render();
      const slug = item.label.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
      downloadWav(L, R, "crunchyfx-" + (slug || "sound") + "-" + item.id + ".wav");
    }));
    histList.appendChild(el);
  }
}
document.getElementById("clearhist").addEventListener("click", () => { histItems.length = 0; renderHistory(); });
renderHistory();

// ---------- Scope drawing ----------
const scope = document.getElementById("scope");
const sctx = scope.getContext("2d");
function drawScope(L, R) {
  const w = scope.width, h = scope.height;
  sctx.clearRect(0, 0, w, h);
  sctx.strokeStyle = "#322c40";
  sctx.beginPath(); sctx.moveTo(0, h / 2); sctx.lineTo(w, h / 2); sctx.stroke();
  const step = L.length / w;
  const trace = (data, color, alpha) => {
    sctx.globalAlpha = alpha;
    sctx.strokeStyle = color;
    sctx.lineWidth = 1.5;
    sctx.beginPath();
    for (let x = 0; x < w; x++) {
      const v = data[Math.floor(x * step)] || 0;
      const y = h / 2 - v * (h / 2 - 4);
      x === 0 ? sctx.moveTo(x, y) : sctx.lineTo(x, y);
    }
    sctx.stroke();
    sctx.globalAlpha = 1;
  };
  trace(R, "#45d0ff", 0.55);   // right channel, faint blue
  trace(L, "#ff7a45", 1);      // left channel, accent
}

// Overlay a warning when the current sound has no audible output.
function markScopeSilent() {
  sctx.save();
  sctx.fillStyle = "rgba(255,90,90,0.95)";
  sctx.font = "bold 13px ui-sans-serif, system-ui, sans-serif";
  sctx.textAlign = "center";
  sctx.fillText("⚠ no audible output — raise Cutoff / Gain or shorten the envelope", scope.width / 2, scope.height / 2 - 6);
  sctx.restore();
}

// ---------- UI build ----------
const groups = {};
for (const p of PARAMS) {
  const [key, label, min, max, step, def, unit, group, kind] = p;
  (groups[group] ||= []).push(p);
}

const panels = document.getElementById("panels");
const outputs = {};

function fmt(p, val) {
  const [key, , , , , , unit, , kind] = p;
  if (kind === "wave") return WAVES[Math.round(val)];
  if (kind === "enum") return p[9][Math.round(val)];
  let s = (Math.abs(val) >= 100 || Number.isInteger(val)) ? Math.round(val) : val.toFixed(2);
  return s + (unit ? " " + unit : "");
}

for (const [group, ps] of Object.entries(groups)) {
  const panel = document.createElement("div");
  panel.className = "panel";
  panel.innerHTML = `<h2>${group}</h2>`;
  for (const p of ps) {
    const [key, label, min, max, step, def, unit, , kind] = p;
    if (kind === "wave") {
      const row = document.createElement("div");
      row.className = "waverow";
      const sel = `<select data-key="${key}">${WAVES.map((w,i)=>`<option value="${i}">${w}</option>`).join("")}</select>`;
      row.innerHTML = `<label>${label}</label>${sel}` +
        `<label class="wavelock" title="Keep this waveform when switching presets / randomizing">` +
        `<input type="checkbox" id="waveLock">🔒</label>`;
      panel.appendChild(row);
      const el = row.querySelector("select");
      el.value = state[key];
      el.addEventListener("change", () => { state[key] = +el.value; play(); });
      row.querySelector("#waveLock").addEventListener("change", (e) => { waveLocked = e.target.checked; });
    } else if (kind === "enum") {
      const list = p[9];
      const row = document.createElement("div");
      row.className = "waverow";
      const sel = `<select data-key="${key}">${list.map((w, i) => `<option value="${i}">${w}</option>`).join("")}</select>`;
      row.innerHTML = `<label>${label}</label>${sel}`;
      panel.appendChild(row);
      const el = row.querySelector("select");
      el.value = state[key];
      el.addEventListener("change", () => { state[key] = +el.value; play(); });
    } else {
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `<label>${label}</label>
        <input type="range" data-key="${key}" min="${min}" max="${max}" step="${step}" value="${state[key]}">
        <output></output>`;
      panel.appendChild(row);
      const input = row.querySelector("input");
      const out = row.querySelector("output");
      outputs[key] = out;
      out.textContent = fmt(p, state[key]);
      input.addEventListener("input", () => {
        state[key] = +input.value;
        out.textContent = fmt(p, state[key]);
        updateMacros();
      });
      input.addEventListener("change", () => play());
    }
  }
  panels.appendChild(panel);
}

function syncUI() {
  for (const p of PARAMS) {
    const key = p[0];
    const el = document.querySelector(`[data-key="${key}"]`);
    if (el) el.value = state[key];
    if (outputs[key]) outputs[key].textContent = fmt(p, state[key]);
  }
  updateMacros();
}

// ---------- Randomize + presets ----------
// Peak of a candidate patch, rendered without disturbing the live editor state.
function patchPeak(patch) {
  return withState(patch, () => render()).rawPeak;
}
// Keep re-rolling `makePatch()` until it produces an audible sound (or we give up).
// This is the "filter out sounds that can't be heard" half of the request.
function audiblePatch(makePatch, tries = 16) {
  let patch = makePatch();
  for (let i = 0; i < tries; i++) {
    if (i > 0) patch = makePatch();
    if (patchPeak(patch) > AUDIBLE_FLOOR) return patch;
  }
  return patch; // gave up — caller still gets a (flagged) sound
}

function randomPatch() {
  const patch = { duration: state.duration, gain: state.gain, repeat: state.repeat, rate: state.rate };
  for (const p of PARAMS) {
    const [key, , min, max, step, , , , kind] = p;
    if (key in patch) continue; // keep these at current values
    let v = min + Math.random() * (max - min);
    v = Math.round(v / step) * step;
    patch[key] = (kind === "wave" || kind === "enum") ? Math.round(v) : v;
  }
  if (waveLocked) patch.wave = state.wave;   // respect the waveform lock
  return patch;
}

function randomize() {
  applyPreset(audiblePatch(randomPatch), "Random");
}

const DEFAULT_VARY = { freq: 0.14, sweep: 0.12, decay: 0.2, release: 0.2, cutoff: 0.15, drive: 0.25 };
const PARAM_BY_KEY = {};
for (const p of PARAMS) PARAM_BY_KEY[p[0]] = p;

// Nudge one param around `base` by fraction `amount`. Pitch snaps to semitones so
// the variations sound musical rather than detuned; everything else clamps to range.
function jitter(key, base, amount) {
  const p = PARAM_BY_KEY[key];
  if (!p) return base;
  const [, , min, max, step] = p;
  const r = (Math.random() * 2 - 1) * amount;
  let v;
  if (key === "freq") {
    const semis = Math.round(r * 24);           // amount 0.16 -> ~+/-4 semitones
    v = base * Math.pow(2, semis / 12);
  } else if (min >= 0 && base > 0) {
    v = base * (1 + r);                         // proportional (times, cutoff, drive...)
  } else {
    v = base + r * (max - min);                 // bipolar / zero-based (sweep, filter env)
  }
  v = Math.min(max, Math.max(min, v));
  return Math.round(v / step) * step;
}

// Build a randomized instance of a preset: copy it, then jitter the _vary params.
function varyPreset(preset) {
  const out = {};
  for (const [k, v] of Object.entries(preset)) if (k !== "_vary") out[k] = v;
  const vary = preset._vary || DEFAULT_VARY;
  for (const [k, amt] of Object.entries(vary)) {
    const base = k in out ? out[k] : (PARAM_BY_KEY[k] ? PARAM_BY_KEY[k][5] : 0);
    out[k] = jitter(k, base, amt);
  }
  return out;
}

function applyPreset(obj, label) {
  // reset to defaults first, then overlay (ignore any _vary metadata)
  const keepWave = state.wave;
  for (const p of PARAMS) state[p[0]] = p[5];
  for (const [k, v] of Object.entries(obj)) if (k !== "_vary") state[k] = v;
  if (waveLocked) state.wave = keepWave;   // waveform lock overrides the preset
  seqLabel = label || "Sound";             // remember what the editor is holding (for Sequence chips)
  syncUI();
  play(label || "Preset");
}

function filterPresets() {
  const q = presetSearch.value.trim().toLowerCase();
  let shown = 0;
  sections.forEach(({ details, buttons }, idx) => {
    let secShown = 0;
    for (const b of buttons) {
      const match = !q || b.textContent.toLowerCase().includes(q);
      b.style.display = match ? "" : "none";
      if (match) secShown++;
    }
    details.style.display = secShown ? "" : "none";
    details.open = q ? secShown > 0 : idx === 0;     // reveal matches; else restore default
    shown += secShown;
  });

// Each macro is one plain-language slider (0..1) that writes a handful of the real
// params at once, so someone who doesn't know "cutoff" or "unison" can still shape
// the sound. `to(v)` maps the slider to params; `from()` reads one representative

    from: () => clamp01(state.drive / 0.85) },

    from: () => clamp01(state.reverb / 0.85) },

    from: () => clamp01(state.subOsc / 0.6) },

function applyMacro(m, v) {
  const t = m.to(v);
  for (const k in t) {
    state[k] = t[k];
    const el = document.querySelector(`[data-key="${k}"]`);
    if (el) el.value = state[k];
    const p = PARAM_BY_KEY[k];
    if (p && outputs[k]) outputs[k].textContent = fmt(p, state[k]);
  }
}
// Refresh every macro slider from the current params (called after any raw-slider

// ---------- Shareable links ----------
// Pack the current sound into the URL so it can be shared or bookmarked. Like a
// preset, we store only the params that differ from their defaults, JSON'd and
// base64url'd into the hash — so a simple sound makes a short link. Opening such a
// link reproduces the exact sound. Version-tagged so the format can evolve.
function encodePatch() {
  const diff = {};
  for (const p of PARAMS) { const k = p[0]; if (state[k] !== p[5]) diff[k] = state[k]; }
  const payload = { v: 1, s: diff };
  if (!normalizeOut) payload.n = 0;             // normalize defaults on; only note when off
  return btoa(JSON.stringify(payload)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function decodePatch(str) {
  let b64 = str.replace(/-/g, "+").replace(/_/g, "/");
  while (b64.length % 4) b64 += "=";
  const obj = JSON.parse(atob(b64));
  if (!obj || typeof obj.s !== "object") throw new Error("unrecognized link");
  return obj;
}
// If the URL carries a shared sound (#s=…), load & play it. Returns true if it did.
function loadFromHash() {
  const m = location.hash.match(/[#&]s=([^&]+)/);
  if (!m) return false;
  try {
    const obj = decodePatch(m[1]);
    normalizeOut = obj.n !== 0;                 // absent -> default (on)
    updateNormBtn();
    applyPreset(obj.s, "Shared");               // reset-to-defaults + overlay + syncUI + play
    return true;
  } catch (e) {
    console.warn("crunchyfx: could not read shared link —", e.message);
    return false;
  }
}

const shareBtn = document.getElementById("share");
shareBtn.addEventListener("click", async () => {
  const enc = encodePatch();
  const url = location.href.split("#")[0] + "#s=" + enc;
  try { history.replaceState(null, "", "#s=" + enc); } catch (e) { location.hash = "s=" + enc; }  // reflect in the address bar
  const label = shareBtn.textContent;
  try {
    await navigator.clipboard.writeText(url);   // undefined on insecure/file:// -> caught
    shareBtn.textContent = "✓ Link copied!";
  } catch (e) {
    shareBtn.textContent = "🔗 Link in address bar";
  }
  setTimeout(() => { shareBtn.textContent = label; }, 1600);
});

// ---------- Breeding (evolve sounds by picking favorites) ----------
// A "genome" is a full param set. Open the grid on the current sound; it shows the
// seed + mutated siblings. Select the ones you like and Breed: selected parents are
// crossed (uniform crossover) and mutated into the next generation, with one parent
// carried over unchanged (elitism) so a good sound is never lost. wave/duration/gain
// are held fixed so a generation stays a recognizable *family* of the same sound.
const BREED_SKIP = new Set(["wave", "duration", "gain"]);
const BREED_AMT = 0.22;
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

function genomeFromState() { const g = {}; for (const p of PARAMS) g[p[0]] = state[p[0]]; return g; }
function mutateGenome(src, amount) {
  const g = {};
  for (const p of PARAMS) {
    const k = p[0];
    g[k] = (!BREED_SKIP.has(k) && Math.random() < 0.6) ? jitter(k, src[k], amount) : src[k];
  }
  return g;
}
function crossGenome(a, b) { const g = {}; for (const p of PARAMS) { const k = p[0]; g[k] = Math.random() < 0.5 ? a[k] : b[k]; } return g; }
// One audible child from the parent pool (retry a few times to dodge silent duds).
function breedChild(parents, amount) {
  for (let t = 0; t < 10; t++) {
    const g = parents.length >= 2 ? mutateGenome(crossGenome(pick(parents), pick(parents)), amount)
                                  : mutateGenome(parents[0], amount);
    if (patchPeak(g) > AUDIBLE_FLOOR) return g;
  }
  return mutateGenome(parents[0], amount);
}

let breedGenomes = [];
let breedGen = 1;

function drawMini(canvas, L, R) {
  const c = canvas.getContext("2d"), w = canvas.width, h = canvas.height;
  c.clearRect(0, 0, w, h);
  c.strokeStyle = "#2a2436"; c.beginPath(); c.moveTo(0, h / 2); c.lineTo(w, h / 2); c.stroke();
  const step = L.length / w;
  const trace = (data, color, alpha) => {
    c.globalAlpha = alpha; c.strokeStyle = color; c.lineWidth = 1; c.beginPath();
    for (let x = 0; x < w; x++) { const v = data[Math.floor(x * step)] || 0; const y = h / 2 - v * (h / 2 - 2); x ? c.lineTo(x, y) : c.moveTo(x, y); }
    c.stroke(); c.globalAlpha = 1;
  };
  trace(R, "#45d0ff", 0.5); trace(L, "#ff7a45", 1);
}

function selectedGenomes() {
  const sel = [];
  breedGrid.querySelectorAll(".breed-cell.sel").forEach((c) => sel.push(breedGenomes[+c.dataset.idx]));
  return sel;
}
function renderBreedGrid() {
  breedGrid.innerHTML = "";
  breedGenomes.forEach((g, i) => {
    const { L, R } = withState(g, () => render());
    const cell = document.createElement("div");
    cell.className = "breed-cell";
    cell.dataset.idx = i;
    const cv = document.createElement("canvas");
    cv.width = 280; cv.height = 62;
    cell.appendChild(cv);
    const bar = document.createElement("div");
    bar.className = "breed-cell-bar";
    bar.innerHTML = '<button class="breed-play">▶</button><span class="breed-tag">gen ' + breedGen + ' · #' + (i + 1) + '</span>';
    cell.appendChild(bar);
    breedGrid.appendChild(cell);
    drawMini(cv, L, R);
    bar.querySelector(".breed-play").addEventListener("click", (e) => { e.stopPropagation(); const r = withState(g, () => render()); playBuffer(r.L, r.R); });
    cell.addEventListener("click", () => cell.classList.toggle("sel"));
    cell.addEventListener("dblclick", (e) => { e.preventDefault(); adoptGenome(g); });
  });
  breedGenEl.textContent = "Generation " + breedGen + " — 9 sounds";
}
function seedBreedGrid() {
  const seed = genomeFromState();
  breedGenomes = [seed];
  for (let i = 1; i < 9; i++) breedGenomes.push(breedChild([seed], BREED_AMT));
  breedGen = 1;
  renderBreedGrid();
}
function breedNext() {
  const sel = selectedGenomes();
  const parents = sel.length ? sel : breedGenomes;
  const next = [pick(parents)];                       // elitism: carry one parent unchanged
  for (let i = 1; i < 9; i++) next.push(breedChild(parents, BREED_AMT));
  breedGenomes = next; breedGen++;
  renderBreedGrid();
}
function adoptGenome(g) { applyPreset(g, "Bred"); breedModal.hidden = true; }

      chip.innerHTML =
        '<button class="seq-chip-play" title="Hear this step">▶</button>' +
        '<span class="seq-chip-name">' + (i + 1) + ' · ' + s.label + '</span>' +
        '<button class="seq-chip-del" title="Remove">✕</button>';
      seqList.appendChild(chip);
      chip.querySelector(".seq-chip-play").addEventListener("click", (e) => { e.stopPropagation(); const r = withState(s.genome, () => render()); playBuffer(r.L, r.R); });
      chip.querySelector(".seq-chip-del").addEventListener("click", (e) => { e.stopPropagation(); sequence.splice(i, 1); renderSeq(); });
      // drag to reorder
      chip.addEventListener("dragstart", (e) => { e.dataTransfer.setData("text/plain", i); chip.classList.add("drag"); });
      chip.addEventListener("dragend", () => chip.classList.remove("drag"));
      chip.addEventListener("dragover", (e) => e.preventDefault());
      chip.addEventListener("drop", (e) => { e.preventDefault(); moveSeq(+e.dataTransfer.getData("text/plain"), i); });
    });
  }
  const empty = sequence.length === 0;
  seqPlayBtn.disabled = empty;
  seqExportBtn.disabled = empty;
  seqClearBtn.disabled = empty;
}
function moveSeq(from, to) {
  if (from === to || from < 0 || from >= sequence.length) return;
  const [item] = sequence.splice(from, 1);
  sequence.splice(to, 0, item);
  renderSeq();
}
// Render every step and concatenate the buffers back-to-back into one sound.
function renderSequenceBuffers() {
  const parts = sequence.map((s) => withState(s.genome, () => render()));
  const total = parts.reduce((n, r) => n + r.L.length, 0);
  const L = new Float32Array(total), R = new Float32Array(total);
  let off = 0;
  for (const r of parts) { L.set(r.L, off); R.set(r.R, off); off += r.L.length; }
  return { L, R };
}
function playSequence() { if (!sequence.length) return; const { L, R } = renderSequenceBuffers(); drawScope(L, R); playBuffer(L, R); }
function exportSequence() { if (!sequence.length) return; const { L, R } = renderSequenceBuffers(); downloadWav(L, R, "crunchyfx-sequence-" + sequence.length + "steps.wav"); }

seqAddBtn.addEventListener("click", () => { sequence.push({ genome: genomeFromState(), label: seqLabel }); renderSeq(); });
seqPlayBtn.addEventListener("click", playSequence);
seqExportBtn.addEventListener("click", exportSequence);
seqClearBtn.addEventListener("click", () => { sequence = []; renderSeq(); });
renderSeq();

// initial draw — or load a shared sound from the URL, if one is present
if (!loadFromHash()) { const { L, R } = render(); drawScope(L, R); }
</script>
